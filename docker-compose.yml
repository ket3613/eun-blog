services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "https://api.taeklab.cc"
    image: eun-blog:latest
    container_name: eun-blog
    ports:
      - "8082:8082"
    restart: always
    environment:
      - TZ=Asia/Seoul
      # 비밀값은 compose 파일과 같은 디렉터리의 .env 에서 주입 (git에 커밋 금지)
      # 값이 없으면 기동을 중단해 빈 시크릿으로 실행되는 것을 막는다.
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is not set in .env}
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN is not set in .env}
